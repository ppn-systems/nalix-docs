name: "Deploy to Cloudflare Pages (Manual)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Cloudflare environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: cloudflare-manual-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-and-deploy:
    name: "Test, Build & Deploy to Cloudflare"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.cf_deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run i18n, navigation, link, and source parity tests
        run: npm test

      - name: Build static site with Astro
        run: npm run build

      # `wrangler pages deploy` does not create the project, so create it on the first run.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler pages project list | grep -qw "nalix-docs"; then
            echo "Pages project nalix-docs already exists."
          else
            npx wrangler pages project create nalix-docs --production-branch=master
          fi

      - name: Deploy static site to Cloudflare Pages
        id: cf_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nalix-docs --branch=master
