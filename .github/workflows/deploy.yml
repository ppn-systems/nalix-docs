name: "Docs: Test, Build & Deploy (Cloudflare)"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: cloudflare-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  test-and-build:
    name: "Test (i18n & Integrity) & Build (Astro)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run i18n, navigation, and link integrity tests
        run: npm test

      - name: Build static site with Astro
        run: npm run build

      - name: Upload built static assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-assets
          path: ./dist
          retention-days: 1

  deploy:
    name: "Deploy to Cloudflare"
    needs: test-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.cf_deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built static assets
        uses: actions/download-artifact@v4
        with:
          name: dist-assets
          path: ./dist

      - name: Deploy to Cloudflare Workers Static Assets
        id: cf_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
