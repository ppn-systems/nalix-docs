name: "CI: Test & Build Verification"

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "Verify Docs Integrity & Astro Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (content, navigation, links, tools, docs-vs-source audit)
        run: npm test

      - name: Build static site with Astro
        run: npm run build

      - name: Verify Cloudflare Pages output
        run: test -f dist/index.html && test -f dist/404.html
