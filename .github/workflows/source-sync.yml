name: "Source Sync: Nalix → Docs"

# Compares the Nalix source with source-manifest.json and classifies what changed: public API the docs
# do not show yet (red), behavior in code the docs describe (yellow), API the docs already match or
# internal changes (ignored). Only when something needs the docs does it open — or refresh — one draft
# PR on `bot/source-sync` carrying the updated manifest/API index and a report with signature diffs
# and the docs lines to edit. Check out that branch, fix the pages, push, and merge.
on:
  schedule:
    - cron: "17 1 * * *" # daily, 01:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Nalix branch, tag or commit to compare against"
        required: false
        default: "HEAD"
  repository_dispatch:
    types: [nalix-updated]

concurrency:
  group: source-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: "Detect Nalix source drift"
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/source-sync
      BASE: ${{ github.event.repository.default_branch }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898729+github-actions[bot]@users.noreply.github.com
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NALIX_REF: ${{ inputs.ref || github.event.client_payload.ref || 'HEAD' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare Nalix source with manifest
        id: check
        run: |
          REPORT="$RUNNER_TEMP/source-sync-report.md"
          set +e
          python3 tools/run.py sync-check --ref "$NALIX_REF" --report "$REPORT" --pr-body "$RUNNER_TEMP/source-sync-pr-body.md" --plan "$RUNNER_TEMP/source-sync-plan.json" --update
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)
              if [ -f "$REPORT" ]; then
                echo "✅ Nalix changed, but nothing in it affects the docs (internal changes, or API the docs already show)." >> "$GITHUB_STEP_SUMMARY"
                cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "✅ Docs are in sync with Nalix source." >> "$GITHUB_STEP_SUMMARY"
              fi ;;
            1) cat "$REPORT" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::source-sync failed (exit $code) — see the log above."; exit "$code" ;;
          esac

      - name: Audit docs against the new source
        if: steps.check.outputs.code == '1'
        run: |
          # source-api-index.json was just regenerated for the new commit; findings are informational here.
          python3 tools/run.py audit --baseline tools/docs-audit-baseline.json --markdown "$RUNNER_TEMP/audit.md" || true
          cat "$RUNNER_TEMP/audit.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/audit.md" >> "$RUNNER_TEMP/source-sync-report.md"

      - name: Upload full report and edit plan
        if: steps.check.outputs.code == '1'
        uses: actions/upload-artifact@v4
        with:
          name: source-sync-report
          path: |
            ${{ runner.temp }}/source-sync-report.md
            ${{ runner.temp }}/source-sync-plan.json

      - name: Open or refresh draft PR
        if: steps.check.outputs.code == '1'
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/source-sync-report.md"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          commit=$(python3 -c "import json; print(json.load(open('source-manifest.json'))['nalixCommit'])")
          mkdir -p "$RUNNER_TEMP/snapshot"
          cp source-manifest.json source-api-index.json "$RUNNER_TEMP/snapshot/"

          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')

          # Commits on the branch that a person pushed (docs fixes in progress) must never be force-pushed away.
          human=0
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            human=$(git log "origin/$BASE..origin/$BRANCH" --format=%ae | grep -vcxF "$BOT_EMAIL" || true)
          fi

          git stash --include-untracked > /dev/null
          if [ -n "$pr" ] && [ "$human" -gt 0 ]; then
            echo "Branch has $human human commit(s): adding the manifest update on top (no force-push)."
            git switch -C "$BRANCH" "origin/$BRANCH"
            cp "$RUNNER_TEMP/snapshot/source-manifest.json" "$RUNNER_TEMP/snapshot/source-api-index.json" .
            git add source-manifest.json source-api-index.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(source-sync): bump manifest to nalix ${commit:0:7}"
              git push origin "$BRANCH"
            fi
          else
            git switch -C "$BRANCH" "origin/$BASE"
            cp "$RUNNER_TEMP/snapshot/source-manifest.json" "$RUNNER_TEMP/snapshot/source-api-index.json" .
            git add source-manifest.json source-api-index.json
            git commit -m "chore(source-sync): bump manifest to nalix ${commit:0:7}"
            git push --force origin "$BRANCH"
          fi

          {
            echo "> Automated by \`.github/workflows/source-sync.yml\`. Check out \`$BRANCH\`, update the pages below, push, and mark ready for review. Merging records nalix \`${commit:0:7}\` as synced. Changes that do not affect the docs are not listed."
            echo
            cat "$RUNNER_TEMP/source-sync-pr-body.md"
            if [ -s "$RUNNER_TEMP/audit.md" ]; then echo; head -c 4000 "$RUNNER_TEMP/audit.md"; fi
          } > "$RUNNER_TEMP/body.md"
          # GitHub caps PR bodies at 65,536 characters (the report is already capped; this is a final guard).
          if [ "$(wc -c < "$RUNNER_TEMP/body.md")" -gt 64000 ]; then head -c 64000 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/body.trim.md"; mv "$RUNNER_TEMP/body.trim.md" "$RUNNER_TEMP/body.md"; fi

          title="docs: sync with nalix ${commit:0:7}"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Refreshed PR #$pr" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --draft --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
